name: Naver Blog Sync

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Optional blog_import_runs.id to process"
        required: false
        type: string

concurrency:
  group: naver-blog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update github_run_id to Supabase
        if: "${{ github.event.inputs.run_id != '' }}"
        run: |
          curl -X PATCH "${{ env.VITE_SUPABASE_URL }}/rest/v1/blog_import_runs?id=eq.${{ github.event.inputs.run_id }}" \
            -H "apikey: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ env.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            -d "{\"github_run_id\": \"${{ github.run_id }}\"}"

      - name: Process blog import queue
        run: |
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            npm run blog:worker -- --run-id "${{ github.event.inputs.run_id }}"
          else
            npm run blog:worker
          fi
