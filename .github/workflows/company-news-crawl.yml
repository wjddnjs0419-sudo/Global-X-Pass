name: Company News Crawl

on:
  schedule:
    - cron: "0 0,6,12,18 * * *"
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Number of companies to process in one run"
        required: false
        default: "25"
      results_per_company:
        description: "Maximum unique news items to keep per company"
        required: false
        default: "1"
      delay_ms:
        description: "Delay between company and article requests"
        required: false
        default: "300"
      max_stored_articles:
        description: "Maximum total articles to keep after each crawl"
        required: false
        default: "300"
      min_relevance_score:
        description: "Minimum relevance score for company news"
        required: false
        default: "3"

concurrency:
  group: company-news-crawl
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  crawl:
    runs-on: ubuntu-latest

    env:
      SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      BATCH_SIZE: ${{ github.event.inputs.batch_size }}
      RESULTS_PER_COMPANY: ${{ github.event.inputs.results_per_company }}
      DELAY_MS: ${{ github.event.inputs.delay_ms }}
      MAX_STORED_ARTICLES: ${{ github.event.inputs.max_stored_articles }}
      MIN_RELEVANCE_SCORE: ${{ github.event.inputs.min_relevance_score }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Crawl company news
        run: |
          ARGS=(
            --batch-size "${BATCH_SIZE:-25}"
            --results-per-company "${RESULTS_PER_COMPANY:-1}"
            --delay-ms "${DELAY_MS:-300}"
            --max-stored-articles "${MAX_STORED_ARTICLES:-300}"
            --min-relevance-score "${MIN_RELEVANCE_SCORE:-3}"
          )

          node scripts/crawl-company-news.mjs "${ARGS[@]}"
